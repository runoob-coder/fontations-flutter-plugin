<body>
  <!--
    The Rust wasm module is built with shared memory and runs on a pool of Web
    Workers, which needs `SharedArrayBuffer`, which browsers only hand out to a
    cross origin isolated page. Neither `flutter run -d chrome` nor a plain
    static host sends the two headers that make a page isolated, so a service
    worker adds them instead: it rewrites the headers of this document and the
    page reloads once to run under it. Without this the module panics at start
    up with "SharedArrayBuffer transfer requires self.crossOriginIsolated".

    See web/coi_serviceworker.js.
  -->
  <script>
    (async () => {
      if (self.crossOriginIsolated || !('serviceWorker' in navigator)) {
        return;
      }
      // Reload at most once per tab, so a browser that cannot isolate the page
      // at all (or a file:// origin, where service workers are not allowed)
      // shows the app instead of spinning in a reload loop.
      if (sessionStorage.getItem('coi_reloaded') === '1') {
        return;
      }
      sessionStorage.setItem('coi_reloaded', '1');
      await navigator.serviceWorker.register('coi_serviceworker.js');
      if (!navigator.serviceWorker.controller) {
        await new Promise((resolve) =>
          navigator.serviceWorker.addEventListener(
            'controllerchange',
            resolve,
            { once: true },
          ),
        );
      }
      if (!self.crossOriginIsolated) {
        location.reload();
      }
    })();
  </script>

[package]
name = "fontations"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` lets rust/fuzz (and any other Rust crate) link this code as a normal
# dependency; cdylib/staticlib alone are not linkable from another crate.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
kurbo = "0.13"
read-fonts = "0.47.0"
skera = "0.10.0"
skrifa = "0.50.0"
write-fonts = "0.56.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

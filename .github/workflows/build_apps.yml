name: Build & release example apps

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  release:
    types: [published]
  workflow_dispatch:

# Only the release job needs to write; build jobs stay read-only.
permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only the PR comment step writes; everything else stays read-only.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # cargokit/gradle builds the crate with the Android NDK through cargo-ndk.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Android Rust targets
        run: >-
          rustup target add
          armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: example dependencies
        working-directory: example
        run: flutter pub get
      # flutter 3.44 起，打包需要传递 -Pdisable-abi-filtering=true 参数，
      # 让默认 abiFilters (arm64-v8a) 真正生效，避免构建出被自动 ABI 过滤的空包。
      - name: Build APK
        working-directory: example
        run: flutter build apk --release -Pdisable-abi-filtering=true
      - name: Package APK
        working-directory: example
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find build/app/outputs/flutter-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/fontations_example.apk
          ls -lh dist/fontations_example.apk
      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: fontations-example-android
          path: example/dist/fontations_example.apk
          if-no-files-found: error
          retention-days: 30
      - name: Comment APK download link on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- fontations-example-apk -->';
            const artifactUrl = '${{ steps.upload-apk.outputs.artifact-url }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## 📦 Android APK 构建完成',
              '',
              `- 提交：\`${context.sha.slice(0, 7)}\``,
              `- 下载：**${artifactUrl}**`,
              `- 构建日志：${runUrl}`,
              '',
              '> 下载链接需要登录 GitHub 后访问；artifact 保留 30 天。'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  windows:
    name: Windows bundle
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # cargokit/cmake compiles the crate during the CMake build.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build Windows
        working-directory: example
        run: flutter build windows --release
      - name: Package Windows bundle
        working-directory: example
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path 'build\windows' -Recurse -File -Filter 'fontations_example.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Windows executable not found' }
          Compress-Archive -Path (Join-Path $exe.DirectoryName '*') -DestinationPath 'dist\fontations_example-windows.zip' -Force
          Get-Item dist\fontations_example-windows.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: fontations-example-windows
          path: example/dist/fontations_example-windows.zip
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: example dependencies
        working-directory: example
        run: flutter pub get
      - name: Build Linux
        working-directory: example
        run: flutter build linux --release
      - name: Package Linux bundle
        working-directory: example
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle="$(find build/linux -type d -name bundle -print -quit)"
          test -n "$bundle"
          tar -czf dist/fontations_example-linux.tar.gz \
            -C "$(dirname "$bundle")" bundle
          ls -lh dist/fontations_example-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: fontations-example-linux
          path: example/dist/fontations_example-linux.tar.gz
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web bundle
    # main already gets a live preview from deploy_web.yml; here we only need
    # a downloadable bundle for releases and manual runs.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # build_web.sh needs nightly + rust-src for the shared-memory wasm module.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: build the wasm module
        run: ./scripts/build_web.sh example/web/pkg
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: example dependencies
        working-directory: example
        run: flutter pub get
      # No --base-href: the zip is meant to be served from a site root.
      - name: Build Web
        working-directory: example
        run: flutter build web --release --no-web-resources-cdn
      - name: Package Web bundle
        working-directory: example
        run: |
          set -euo pipefail
          test -f build/web/pkg/fontations_bg.wasm
          test -f build/web/coi_serviceworker.js
          touch build/web/.nojekyll
          mkdir -p dist
          (cd build/web && zip -r -q ../../dist/fontations_example-web.zip .)
          ls -lh dist/fontations_example-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fontations-example-web
          path: example/dist/fontations_example-web.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach bundles and notes
    if: github.event_name == 'release'
    needs: [android, windows, linux, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fontations-example-*
          merge-multiple: true
          path: dist
      - name: Upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
      - name: Write build links into the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          marker='<!-- fontations-release-artifacts -->'
          gh release view "$TAG" --json body -q .body > /tmp/body.md
          base="https://github.com/$OWNER/$REPO/releases/download/$TAG"
          {
            # Keep hand written notes; replace a previously appended section.
            awk -v marker="$marker" 'index($0, marker) { exit } { print }' /tmp/body.md
            printf '\n%s\n## Demo builds\n\n' "$marker"
            printf -- '- [Android APK](%s/fontations_example.apk)\n' "$base"
            printf -- '- [Windows (zip)](%s/fontations_example-windows.zip)\n' "$base"
            printf -- '- [Linux (tar.gz)](%s/fontations_example-linux.tar.gz)\n' "$base"
            printf -- '- [Web bundle (zip)](%s/fontations_example-web.zip)\n\n' "$base"
            printf 'Web preview (`main`): https://%s.github.io/%s/\n\n' "$OWNER" "$REPO"
            printf 'The Web bundle uses `<base href="/">` and must be served from a site root; `coi_serviceworker.js` in the zip adds the COOP/COEP headers the wasm module needs.\n'
          } > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md

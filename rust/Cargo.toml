[package]
name = "fontations"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
kurbo = "0.13"
read-fonts = "0.45.0"
skrifa = "0.48.0"
write-fonts = "0.54.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

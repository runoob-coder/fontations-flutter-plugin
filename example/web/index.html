<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fontations_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>fontations_example</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    The Rust wasm module is built with shared memory and runs on a pool of Web
    Workers, which needs `SharedArrayBuffer`, which browsers only hand out to a
    cross origin isolated page. Neither `flutter run -d chrome` nor a plain
    static host sends the two headers that make a page isolated, so a service
    worker adds them instead: it rewrites the headers of this document and the
    page reloads once to run under it. Without this the module panics at start
    up with "SharedArrayBuffer transfer requires self.crossOriginIsolated".

    See web/coi_serviceworker.js.
  -->
  <script>
    (async () => {
      if (self.crossOriginIsolated || !('serviceWorker' in navigator)) {
        return;
      }
      // Reload at most once per tab, so a browser that cannot isolate the page
      // at all (or a file:// origin, where service workers are not allowed)
      // shows the app instead of spinning in a reload loop.
      if (sessionStorage.getItem('coi_reloaded') === '1') {
        return;
      }
      sessionStorage.setItem('coi_reloaded', '1');
      await navigator.serviceWorker.register('coi_serviceworker.js');
      if (!navigator.serviceWorker.controller) {
        await new Promise((resolve) =>
          navigator.serviceWorker.addEventListener(
            'controllerchange',
            resolve,
            { once: true },
          ),
        );
      }
      if (!self.crossOriginIsolated) {
        location.reload();
      }
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
